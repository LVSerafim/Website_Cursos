<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef1f5;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container-conteudos {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .coluna {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .coluna h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .coluna ul {
            list-style: none;
        }

        .coluna li {
            margin-bottom: 8px;
        }

        .coluna a {
            display: inline-block;
            padding: 5px 10px;
            font-size: 14px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        .coluna a:hover {
            background: #1a252f;
        }
    </style>
</head>
<body>

<header>
    📚 Área de Conteúdos
</header>

<div class="container-conteudos">

    <div class="coluna">
        <h2>📝 Atividades</h2>
        <ul id="lista-atividades"></ul>
    </div>

    <div class="coluna">
        <h2>💻 Códigos</h2>
        <ul id="lista-codigos"></ul>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://dlevlrgomkfbripwtoym.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsZXZscmdvbWtmYnJpcHd0b3ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNjI0MzksImV4cCI6MjA4NTYzODQzOX0.-BKEFPtVbA2ExRMtttP_XlO_ASpKwf1F87741ijoBnA';
const client = supabase.createClient(supabaseUrl, supabaseKey);

async function carregarAtividades() {
  const { data } = await client.from('atividades').select('*');
  const lista = document.getElementById("lista-atividades");

  if (data && data.length > 0) {
    data.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="${item.arquivo_url}" target="_blank">${item.titulo}</a>`;
      lista.appendChild(li);
    });
  } else {
    lista.innerHTML = "<li>Nenhuma atividade disponível</li>";
  }
}

async function carregarCodigos() {
  const { data } = await client.from('codigos').select('*');
  const lista = document.getElementById("lista-codigos");

  if (data && data.length > 0) {
    data.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="${item.arquivo_url}" target="_blank">${item.titulo}</a>`;
      lista.appendChild(li);
    });
  } else {
    lista.innerHTML = "<li>Nenhum código disponível</li>";
  }
}

carregarAtividades();
carregarCodigos();
</script>

</body>
</html>
