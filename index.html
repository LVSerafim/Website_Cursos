<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Cursos    </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background-color: #007bff;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        nav {
            background-color: #0056b3;
            padding: 0.5rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            display: inline-block;
        }
        
        nav a:hover {
            background-color: #003d82;
        }
        
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .course-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bem-vindo aos Cursos</h1>
        <p>Aprenda novas habilidades</p>
    </header>
    
    <nav>
        <a href="#inicio">Início</a>
        <a href="#cursos">Cursos</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>
    
    <main>
        <section id="cursos">
            <h2>Nossos Cursos</h2>
            <div class="course-grid">
                <div class="course-card">
                    <h3>HTML & CSS</h3>
                    <p>Aprenda a criar websites modernos</p>
                </div>
                <div class="course-card">
                    <h3>JavaScript</h3>
                    <p>Domine a linguagem mais popular da web</p>
                </div>
                <div class="course-card">
                    <h3>Python</h3>
                    <p>Programação para iniciantes e avançados</p>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 Meu Site de Cursos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
